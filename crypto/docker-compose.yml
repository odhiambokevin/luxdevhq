services:
  project:
    build:
      context: ./project
    env_file:
            - ./project/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bridge
  postgres:
    build:
      context: ./db
    container_name: postgres
    restart: always
    env_file:
          - ./db/.env
    logging:
        options:
            max-size: 3m
            max-file: "3"
    ports:
    - 5433:5432
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
          interval: 10s
          timeout: 5s
          retries: 5
    networks:
      - bridge
networks:
  bridge: